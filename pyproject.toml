[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "the-third-eye"
version = "0.1.1"
description = "AI model health and governance control plane for Databricks."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Ravi Kumar", email = "93548891+dcsgod@users.noreply.github.com" }]
keywords = [
  "databricks",
  "mlops",
  "modelops",
  "ai-governance",
  "model-monitoring",
  "ai-observability",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "pyyaml>=6.0",
]

[project.optional-dependencies]
databricks = [
  "databricks-sdk>=0.50",
  "mlflow>=2.0",
  "pyspark>=3.5",
]
llm = [
  "databricks-sdk>=0.50",
]
dev = [
  "pytest>=8.0",
  "ruff>=0.8",
  "build>=1.2",
  "twine>=6.0",
]
all = [
  "databricks-sdk>=0.50",
  "mlflow>=2.0",
  "pyspark>=3.5",
  "pytest>=8.0",
  "ruff>=0.8",
  "build>=1.2",
  "twine>=6.0",
]

[project.urls]
Homepage = "https://github.com/dcsgod/theThirdEye"
Repository = "https://github.com/dcsgod/theThirdEye"
Documentation = "https://github.com/dcsgod/theThirdEye#readme"
Issues = "https://github.com/dcsgod/theThirdEye/issues"
Changelog = "https://github.com/dcsgod/theThirdEye/releases"

[tool.hatch.build.targets.wheel]
packages = [
  "third_eye",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
